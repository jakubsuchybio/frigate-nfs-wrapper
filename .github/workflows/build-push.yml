# Every push to main builds the image and pushes :latest and :<sha> to GitHub Container
# Registry as a PRIVATE package (ghcr.io/jakubsuchybio/frigate-nfs-wrapper). No secrets: the
# workflow's own GITHUB_TOKEN may write this repo's packages. The Frigate VM pulls after a
# one-time `docker login ghcr.io` with a read:packages token.
name: Build & Push Frigate-NFS to GHCR

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/frigate-nfs-wrapper

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
